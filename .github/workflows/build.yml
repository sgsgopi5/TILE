name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Package Web Assets for Capacitor
        run: |
          mkdir -p www
          cp index.html www/

      - name: Set up Android SDK & Java Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Native Capacitor Bridge
        run: |
          npx cap init "Grid Lock" "com.global.gridlock" --web-dir=www
          npx cap add android

      - name: Package Native Android Framework Assets
        run: npx cap sync android

      - name: Assemble Final Debug Testable APK File
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Archive Production Deployment Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gridlock-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
