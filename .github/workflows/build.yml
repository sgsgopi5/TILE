name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Compile Static Assets
        run: npm run build

      - name: Set up Android SDK & Java Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Native Capacitor Bridge
        run: |
          npx cap init "com.global.gridlock" "Grid Lock" --web-dir=.
          npx cap add android

      - name: Package Native Android Framework Assets
        run: npx cap sync android

      - name: Assemble Final Production APK File
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Archive Production Deployment Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gridlock-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          
