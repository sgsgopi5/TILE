<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Grid Lock: Neon Drift</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #060913 0%, #0f172a 100%);
            --panel-bg: rgba(255, 255, 255, 0.02);
            --panel-border: rgba(255, 255, 255, 0.06);
            --text-primary: #ffffff;
            --text-secondary: #64748b;
            --neon-blue: #38bdf8;
            --neon-pink: #f43f5e;
            --neon-gold: #fbbf24;
            --neon-green: #10b981;
            --neon-purple: #a855f7;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #060913; /* Direct solid fallback configuration */
            background: var(--bg-gradient);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom) 24px;
        }

        .dashboard {
            width: 100%;
            max-width: 400px;
            margin-top: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
        }

        .brand-title {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            background: linear-gradient(to bottom right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .score-box {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 8px 18px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: right;
        }

        .score-label {
            font-size: 0.6rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 700;
        }

        .score-value {
            font-size: 1.3rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: var(--neon-blue);
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .multiplier-tag {
            font-size: 0.65rem;
            font-weight: 900;
            color: var(--neon-gold);
            display: none;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .arena-wrapper {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
            z-index: 5;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 16px;
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            aspect-ratio: 1;
            position: relative;
        }

        .grid-cell {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            aspect-ratio: 1;
            position: relative;
        }

        .game-tile {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.5rem;
            animation: popIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            transition: all 0.15s ease;
        }

        .tile-2 { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); color: #cbd5e1; }
        .tile-4 { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: #ffffff; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }
        .tile-8 { background: linear-gradient(135deg, #0891b2 0%, #0e7490 100%); color: #ffffff; box-shadow: 0 4px 12px rgba(8, 145, 178, 0.3); }
        .tile-16 { background: linear-gradient(135deg, #0d9488 0%, #115e59 100%); color: #ffffff; box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3); }
        .tile-32 { background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%); color: #ffffff; box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3); }
        .tile-64 { background: linear-gradient(135deg, #e11d48 0%, #be123c 100%); color: #ffffff; box-shadow: 0 4px 16px rgba(225, 29, 72, 0.4); }
        .tile-128 { background: linear-gradient(135deg, #ca8a04 0%, #a16207 100%); color: #ffffff; box-shadow: 0 0 20px rgba(202, 138, 4, 0.5); }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .ad-booster-panel {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 12px 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            z-index: 5;
        }

        .ad-info { display: flex; flex-direction: column; }
        .ad-title { font-size: 0.75rem; font-weight: 700; color: var(--text-primary); }
        .ad-desc { font-size: 0.6rem; color: var(--text-secondary); }

        .ad-btn {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            border: none;
            border-radius: 12px;
            color: #000000;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 8px 14px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.3);
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .ad-btn:active { transform: scale(0.95); }

        .footer-hud {
            width: 100%;
            max-width: 400px;
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            z-index: 5;
        }

        .action-pill {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--panel-border);
            padding: 14px 0;
            border-radius: 24px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
            text-transform: uppercase;
            text-align: center;
            transition: all 0.2s ease;
        }

        .action-pill:active { background: rgba(255, 255, 255, 0.08); color: var(--text-primary); }
        .action-pill.primary { background: rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.2); color: var(--neon-blue); }

        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(4, 6, 12, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: linear-gradient(to top, #090d16 85%, rgba(15, 23, 42, 0.95));
            border-top: 1px solid var(--panel-border);
            border-radius: 36px 36px 0 0;
            max-height: 85vh;
            padding: 32px 24px env(safe-area-inset-bottom) 24px;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .overlay.active .modal-content { transform: translateY(0); }
        .lb-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .lb-title { font-size: 1.4rem; font-weight: 800; }
        .close-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--panel-border); color: var(--text-secondary); font-weight: 800; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .lb-list { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px; }
        .lb-row { display: flex; align-items: center; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--panel-border); padding: 14px 20px; border-radius: 20px; justify-content: space-between; }
        .lb-profile { display: flex; align-items: center; gap: 16px; }
        .lb-rank { font-weight: 800; font-size: 1.1rem; width: 24px; color: var(--text-secondary); }
        .rank-1 .lb-rank { color: var(--neon-gold); }
        .lb-name { font-weight: 600; }
